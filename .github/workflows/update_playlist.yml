name: Generate Safe Playlist

on:
  workflow_dispatch:

  schedule:
    - cron: '0 */6 * * *'

  repository_dispatch:
    types: [run-playlist]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Write generator.py safely from Secret
        env:
          SCRIPT_CONTENT: ${{ secrets.GENERATOR_SCRIPT }}
        run: |
          python3 -c "import os; open('generator.py', 'w', encoding='utf-8').write(os.environ['SCRIPT_CONTENT'])"

      - name: Run script
        env:
          PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
        run: |
          python3 generator.py

      - name: Delete old workflow runs to save storage
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1

      - name: Commit and push always
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add playlist.m3u live_events.m3u || true
          git commit --allow-empty -m "Update playlists [skip ci]"

          git pull --rebase origin main || git pull --rebase origin master || true

          git push origin HEAD:main || git push origin HEAD:master || true
