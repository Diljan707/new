name: Generate Safe Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [run-playlist]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      env:
        PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
      run: |
        python3 generator.py

    - name: Commit and push always
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .m3u
        git commit --allow-empty -m ".m3u [skip ci]"
        git pull --rebase origin main || git pull --rebase origin master || true
        git push origin HEAD:main || git push origin HEAD:master || true
        
