name: Generate Safe Playlist

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [run-playlist]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Write generator.py from Secret if provided
        env:
          SCRIPT_CONTENT: ${{ secrets.GENERATOR_SCRIPT }}
        run: |
          python3 -c "
          import os, shutil
          content = os.environ.get('SCRIPT_CONTENT', '')
          if content.strip():
              with open('generator.py', 'w', encoding='utf-8') as f:
                  f.write(content)
              print('[+] Wrote generator.py from GENERATOR_SCRIPT secret.')
          elif os.path.exists('generator.py'):
              print('[*] Using existing generator.py in repo.')
          elif os.path.exists('playlist.py'):
              shutil.copyfile('playlist.py', 'generator.py')
              print('[*] Copied playlist.py to generator.py.')
          else:
              raise RuntimeError('No GENERATOR_SCRIPT secret, generator.py, or playlist.py found!')
          "

      - name: Run script
        env:
          PLAYLIST_URL_1: ${{ secrets.PLAYLIST_URL_1 }}
          PLAYLIST_URL_2: ${{ secrets.PLAYLIST_URL_2 }}
          PLAYLIST_URL_3: ${{ secrets.PLAYLIST_URL_3 }}
          IP_TOKEN_URL_1: ${{ secrets.IP_TOKEN_URL_1 }}
          IP_TOKEN_URL_2: ${{ secrets.IP_TOKEN_URL_2 }}
          IP_TOKEN_URL_3: ${{ secrets.IP_TOKEN_URL_3 }}
        run: |
          python3 generator.py

      - name: Commit and push updated playlists
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          git pull --rebase origin "$BRANCH" || true

          git add playlist.m3u live_events.m3u || true
          git diff --staged --quiet || git commit -m "Update playlists automatically [skip ci]"
          git push origin "HEAD:$BRANCH"

      - name: Delete old workflow runs to save storage
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 1
