name: Generate Safe Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [run-playlist]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write  # Actions nu delete karn layi permissions zaroori ne

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      env:
        PLAYLIST_URL: ${{ secrets.PLAYLIST_URL }}
      run: |
        python3 generator.py

    - name: Delete old workflow runs to save storage
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set +e
        # Sab ton last (current) run nu chhad ke baki sare purane runs di ID chak ke delete kar devega
        run_ids=$(gh run list --limit 100 --json databaseId,status --jq '.[] | select(.status != "in_progress") | .databaseId')
        current_run_id="${{ github.run_id }}"
        
        for id in $run_ids; do
          if [ "$id" != "$current_run_id" ]; then
            echo "Deleting old run ID: $id"
            gh run delete "$id"
          fi
        done

    - name: Commit and push always
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add .m3u
        git commit --allow-empty -m ".m3u [skip ci]"
        git pull --rebase origin main || git pull --rebase origin master || true
        git push origin HEAD:main || git push origin HEAD:master || true
        
