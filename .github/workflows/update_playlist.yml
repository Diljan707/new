name: Generate Safe Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: |
        python3 make_safe_playlist_500.py

    - name: Commit and push if playlist changed
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add safe_500_channels.m3u
        git commit -m "Auto-update safe_500_channels.m3u [skip ci]" || exit 0
        # Push karne se pehle remote changes pull/rebase karenge
        git pull --rebase origin main || git pull --rebase origin master || true
        git push
        
