name: Auto Update Resolved Playlist

on:
  workflow_dispatch: # ਇਸ ਨਾਲ ਤੂੰ ਬਟਨ ਦਬਾ ਕੇ ਮੈਨੂਅਲ ਵੀ ਰਨ ਕਰ ਸਕਦਾ ਹੈਂ
  schedule:
    - cron: '0 */6 * * *' # ਹਰ 6 ਘੰਟੇ ਬਾਅਦ ਆਟੋਮੈਟਿਕ ਚੱਲੇਗਾ

permissions:
  contents: write # ਇਹ ਪਰਮਿਸ਼ਨ ਗਿੱਹਬ ਨੂੰ ਫ਼ਾਈਲ ਸੇਵ/ਪੁਸ਼ ਕਰਨ ਦੀ ਇਜਾਜ਼ਤ ਦਿੰਦੀ ਹੈ

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python your_script_name.py  # ਇੱਥੇ ਆਪਣੀ ਪਾਈਥਨ ਫ਼ਾਈਲ ਦਾ ਨਾਂ ਪੱਕა ਲਿਖ ਦੇਵੀਂ

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add all_channels_fully_resolved.m3u
          git commit -m "Auto-update all resolved channels playlist" || exit 0
          git push
          
