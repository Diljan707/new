name: Auto Update 20 Channels Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # ਹਰ 6 ਘੰਟੇ ਬਾਅਦ ਆਟੋਮੈਟਿਕ ਅਪਡੇਟ ਹੋਵੇਗੀ

permissions:
  contents: write  # ਇਹ ਲਾਈਨ ਬਹੁਤ ਜ਼ਰੂਰੀ ਹੈ ਤਾਂ ਜੋ ਗಿਥੱਬ ਫ਼ਾਈਲ ਨੂੰ ਸੇਵ ਕਰ ਸਕੇ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests

    - name: Run script
      run: |
        python generate_playlist.py

    - name: Commit and push if changed
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add safe_20_channels_ultra.m3u
        git commit -m "Auto-update 20 channels playlist" || exit 0
        git push
        
